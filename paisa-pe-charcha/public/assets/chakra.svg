<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldChakra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEEAC" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  <!-- Outer Rings -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldChakra)" stroke-width="4" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldChakra)" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="100" cy="100" r="26" fill="none" stroke="url(#goldChakra)" stroke-width="3" />
  <circle cx="100" cy="100" r="12" fill="url(#goldChakra)" />
  
  <!-- 24 Spokes of Ashoka Chakra -->
  <g stroke="url(#goldChakra)" stroke-width="2.2" stroke-linecap="round">
    <!-- 0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300, 315, 330, 345 deg -->
    <line x1="100" y1="26" x2="100" y2="74" />
    <line x1="100" y1="126" x2="100" y2="174" />
    <line x1="26" y1="100" x2="74" y2="100" />
    <line x1="126" y1="100" x2="174" y2="100" />
    <g transform="rotate(15 100 100)"><line x1="100" y1="26" x2="100" y2="74" /><line x1="100" y1="126" x2="100" y2="174" /><line x1="26" y1="100" x2="74" y2="100" /><line x1="126" y1="100" x2="174" y2="100" /></g>
    <g transform="rotate(30 100 100)"><line x1="100" y1="26" x2="100" y2="74" /><line x1="100" y1="126" x2="100" y2="174" /><line x1="26" y1="100" x2="74" y2="100" /><line x1="126" y1="100" x2="174" y2="100" /></g>
    <g transform="rotate(45 100 100)"><line x1="100" y1="26" x2="100" y2="74" /><line x1="100" y1="126" x2="100" y2="174" /><line x1="26" y1="100" x2="74" y2="100" /><line x1="126" y1="100" x2="174" y2="100" /></g>
    <g transform="rotate(60 100 100)"><line x1="100" y1="26" x2="100" y2="74" /><line x1="100" y1="126" x2="100" y2="174" /><line x1="26" y1="100" x2="74" y2="100" /><line x1="126" y1="100" x2="174" y2="100" /></g>
    <g transform="rotate(75 100 100)"><line x1="100" y1="26" x2="100" y2="74" /><line x1="100" y1="126" x2="100" y2="174" /><line x1="26" y1="100" x2="74" y2="100" /><line x1="126" y1="100" x2="174" y2="100" /></g>
  </g>
</svg>
